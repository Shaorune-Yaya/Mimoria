services:
  mongodb:
    image: mongo:8.0
    container_name: worldforge-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: worldforge
      MONGO_INITDB_ROOT_PASSWORD: worldforge_dev

    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: worldforge-mongo-express
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: worldforge
      ME_CONFIG_MONGODB_ADMINPASSWORD: worldforge_dev
      ME_CONFIG_MONGODB_URL: mongodb://worldforge:worldforge_dev@mongodb:27017/

      ME_CONFIG_BASICAUTH_ENABLED: "false"

    depends_on:
      - mongodb

volumes:
  mongodb_data: